map $status $assets_cache_control {
  200 "public, max-age=31536000, immutable";
  default "no-store";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets must never fall back to index.html (causes MIME type errors).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control $assets_cache_control always;
  }

  # Always revalidate the SPA shell so deploys pick up new hashed asset names.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}
